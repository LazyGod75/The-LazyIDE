<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: pure CSS, paints before the JS bundle even parses —
           covers the initByokVault await + module eval so the webview never
           shows a blank screen on cold start. createRoot().render()
           replaces it on first mount. -->
      <div style="position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;">
        <img src="/favicon.svg" alt="" width="44" height="44" style="opacity:0.9;" />
        <div style="width:120px;height:2px;background:rgba(255,255,255,0.08);border-radius:1px;overflow:hidden;">
          <div style="width:40%;height:100%;background:#7c5cff;border-radius:1px;animation:lazyboot 1.1s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>@keyframes lazyboot{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}</style>
    </div>
    <script>
      window.__lazyErrors = [];
      // "ResizeObserver loop completed with undelivered notifications" is a
      // benign browser artifact (an RO callback queued a same-frame
      // notification) — not an app fault; keep it out of the error surface
      // so the status bar's "frontend error" badge stays meaningful.
      const BENIGN = /ResizeObserver loop/;
      window.addEventListener('error', (e) => {
        if (BENIGN.test(e.message || '')) return;
        window.__lazyErrors.push({ type: 'error', message: e.message, filename: e.filename, line: e.lineno, stack: e.error?.stack?.slice(0, 800) });
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__lazyErrors.push({ type: 'rejection', reason: String(e.reason), stack: e.reason?.stack?.slice(0, 800) });
      });
      const origErr = console.error;
      console.error = function(...args) {
        window.__lazyErrors.push({ type: 'console.error', msg: args.map(a => typeof a === 'string' ? a : (a?.message || a?.stack || String(a))).join(' ').slice(0, 800) });
        origErr.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
